services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: registrame
      POSTGRES_PASSWORD: registrame
      POSTGRES_DB: registrame_development
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql
  web:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    entrypoint: ["bash", "/app/docker/entrypoint.sh"]
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    environment:
      POSTGRES_HOST: db
      SECRET_KEY_BASE: development-secret-token-change-me-0123456789
      RAILS_ENV: development
      MAIL_SERVER: localhost
      MAIL_PORT: "1025"
      MAIL_DOMAIN: localhost:3000
      MAIL_USERNAME: registrame
      MAIL_PASSWORD: registrame
      MAIL_AUTH: plain
      MAIL_STARTTLS: "false"

volumes:
  pgdata:
